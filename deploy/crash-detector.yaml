# Crash detector: watches Knative user pods for container terminations (read-only pod RBAC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crash-detector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crash-detector
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crash-detector
subjects:
  - kind: ServiceAccount
    name: crash-detector
roleRef:
  kind: Role
  name: crash-detector
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-detector
spec:
  replicas: 1
  selector:
    matchLabels: { app: crash-detector }
  template:
    metadata:
      labels: { app: crash-detector }
    spec:
      serviceAccountName: crash-detector
      containers:
        - name: crash-detector
          image: dev.local/atomic-faas/controllers:dev
          imagePullPolicy: Never
          # Request without limit: must not queue behind function pods during a failure storm.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          command: ["/crash-detector"]
          env:
            - name: REDIS_ADDR
              value: redis.default.svc.cluster.local:6379
            - name: NAMESPACE
              value: default
